server.port=${PORT:9090}
server.address=0.0.0.0
spring.datasource.url=jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
logging.level.org.springframework=INFO

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.application.name=quiz

# Gemini API Configuration (Paused for Testing)
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.model=gemini-2.5-flash

# GLM API Configuration
# glm.api.key=${GLM_API_KEY}
# glm.api.url=https://open.bigmodel.cn/api/paas/v4/chat/completions
# glm.model=glm-4

# Security Configuration
allowed.origins=http://.*:8080,http://.*:9090